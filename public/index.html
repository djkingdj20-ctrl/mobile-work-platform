<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mobile Work</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.header{background:#111827;color:#fff;padding:24px 18px;border-radius:0 0 24px 24px}
.header h1{margin:0;font-size:27px}
.header p{margin:7px 0 0;color:#cbd5e1}
.container{max-width:600px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 4px 15px #0001}
.balance{display:flex;justify-content:space-between;align-items:center}
.balance small{color:#64748b}
.balance h2{margin:5px 0;color:#16a34a}
.task h3{margin:0 0 8px}
.task p{color:#64748b;line-height:1.5}
.reward{color:#16a34a;font-weight:bold}
button{width:100%;padding:14px;border:0;border-radius:11px;background:#2563eb;color:white;font-size:16px;font-weight:bold;margin-top:10px}
.answer{background:#eef2ff;color:#1e40af}
.hidden{display:none}
.back{background:#64748b}
.message{padding:14px;border-radius:10px;margin-top:12px;font-weight:bold}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.footer{text-align:center;color:#94a3b8;padding:25px}
</style>
</head>

<body>

<div class="header">
<h1>Mobile Work</h1>
<p>Complete simple tasks. Earn rewards.</p>
</div>

<div class="container">

<div class="card balance">
<div>
<small>Your Balance</small>
<h2 id="balance">₹0</h2>
</div>
<div>
<small>Completed</small>
<h2 id="completed">0</h2>
</div>
</div>

<div id="taskList">
<h2>Available Tasks</h2>
<p>Loading tasks...</p>
</div>

<div id="taskScreen" class="hidden"></div>

<div class="footer">
Mobile Work Platform
</div>

</div>

<script>

let currentUser=null;
let currentTask=null;

async function registerDemoUser(){

try{

const response=await fetch("/api/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:"Demo Worker",
email:"demo@mobilework.test"
})
});

const data=await response.json();

if(data.success){
currentUser=data.user;
updateUser();
loadTasks();
}

}catch(error){
console.log(error);
}

}

function updateUser(){

if(!currentUser)return;

document.getElementById("balance").textContent="₹"+currentUser.balance;
document.getElementById("completed").textContent=currentUser.tasksCompleted;

}

async function loadTasks(){

try{

const response=await fetch("/api/tasks");
const data=await response.json();

if(!data.success){
document.getElementById("taskList").innerHTML="<p>Unable to load tasks.</p>";
return;
}

document.getElementById("taskList").innerHTML=
"<h2>Available Tasks</h2>"+
data.tasks.map(task=>`

<div class="card task">

<h3>${task.title}</h3>

<p>${task.description}</p>

<div class="reward">Earn ₹${task.reward}</div>

<button onclick="openTask(${task.id})">
Start Task
</button>

</div>

`).join("");

}catch(error){

document.getElementById("taskList").innerHTML=
"<p>Server connection failed.</p>";

}

}

async function openTask(id){

try{

const response=await fetch("/api/tasks");
const data=await response.json();

currentTask=data.tasks.find(t=>t.id===id);

if(!currentTask)return;

document.getElementById("taskList").classList.add("hidden");

document.getElementById("taskScreen").classList.remove("hidden");

document.getElementById("taskScreen").innerHTML=`

<div class="card">

<h2>${currentTask.title}</h2>

<p>${currentTask.description}</p>

<p class="reward">Reward: ₹${currentTask.reward}</p>

<button class="answer" onclick="submitTask('YES')">
YES
</button>

<button class="answer" onclick="submitTask('NO')">
NO
</button>

<button class="back" onclick="goBack()">
Back
</button>

<div id="result"></div>

</div>

`;

}

catch(error){

alert("Unable to open task.");

}

}

async function submitTask(answer){

if(!currentTask||!currentUser)return;

const result=document.getElementById("result");

result.innerHTML="Submitting...";

try{

const response=await fetch("/api/tasks/submit",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
userId:currentUser.id,
taskId:currentTask.id,
answer:answer
})
});

const data=await response.json();

if(data.success){

currentUser.balance=data.balance;
currentUser.tasksCompleted=data.tasksCompleted;

updateUser();

result.innerHTML=`

<div class="message success">
✅ Task completed!<br>
You earned ₹${data.reward}
</div>

`;

}else{

result.innerHTML=`

<div class="message error">
❌ ${data.message}
</div>

`;

}

}catch(error){

result.innerHTML=`

<div class="message error">
❌ Server connection failed.
</div>

`;

}

}

function goBack(){

document.getElementById("taskScreen").classList.add("hidden");
document.getElementById("taskList").classList.remove("hidden");

loadTasks();

}

registerDemoUser();

</script>

</body>
</html>
