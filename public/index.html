<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mobile Work Platform</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}.container{max-width:1100px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#d1d5db}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111827;color:#fff;margin:4px 0}.secondary{background:#e5e7eb;color:#111827}.success{background:#16a34a}.danger{background:#dc2626}.warning{background:#d97706}.export{background:#2563eb}.input,textarea,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px;font-size:15px}textarea{min-height:100px;resize:vertical}.hidden{display:none}.stat{font-size:25px;font-weight:800}.muted{color:#6b7280;font-size:13px}.task-img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin:10px 0}.task-card{border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin:10px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#e5e7eb;margin:2px}.badge.green{background:#dcfce7;color:#166534}.badge.orange{background:#ffedd5;color:#9a3412}.badge.red{background:#fee2e2;color:#991b1b}.answer-box{background:#f8fafc;border-radius:10px;padding:10px;margin-top:8px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.smallbtn{padding:8px 12px;font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:130px}@media(max-width:700px){.grid{grid-template-columns:1fr}.container{padding:10px}.hero h1{font-size:23px}.card{padding:14px}.actions button{min-width:100%;}} </style></head><body><div class="container"><div class="hero"><h1>Mobile Work Platform</h1><p>Complete simple digital work from your mobile and earn.</p></div><div id="app"></div></div><script>const API="";let worker=JSON.parse(localStorage.getItem("mwp_worker")||"null"),business=JSON.parse(localStorage.getItem("mwp_business")||"null"),admin=JSON.parse(localStorage.getItem("mwp_admin")||"null");function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function escapeAttr(v){return escapeHtml(v).replace(/`/g,"&#096;")}async function api(url,options={}){const r=await fetch(API+url,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});if(!r.ok){let d={};try{d=await r.json()}catch(e){}throw new Error(d.error||"Something went wrong")}return r}async function apiJson(url,options={}){const r=await api(url,options);return await r.json()}function save(){localStorage.setItem("mwp_worker",JSON.stringify(worker));localStorage.setItem("mwp_business",JSON.stringify(business));localStorage.setItem("mwp_admin",JSON.stringify(admin))}function logout(type){if(type==="worker")worker=null;if(type==="business")business=null;if(type==="admin")admin=null;save();home()}function downloadUrl(url,filename){const a=document.createElement("a");a.href=url;a.download=filename||"results.csv";document.body.appendChild(a);a.click();a.remove()}function exportBusinessTask(taskId){if(!business)return;downloadUrl("/api/business/"+business.id+"/tasks/"+taskId+"/export","task-results-"+taskId+".csv")}function exportBusinessAll(){if(!business)return;downloadUrl("/api/business/"+business.id+"/export-all","business-results.csv")}function exportAdminTask(taskId){downloadUrl("/api/admin/export-task/"+taskId,"task-results-"+taskId+".csv")}function exportAdminAll(){downloadUrl("/api/admin/export-all","all-business-results.csv")}function home(){if(worker)return workerDashboard();if(business)return businessDashboard();if(admin)return adminDashboard();document.getElementById("app").innerHTML='<div class="grid"><div class="card"><h2>👤 Worker</h2><p>Complete tasks and earn money.</p><button onclick="workerLogin()">Worker Login</button><button class="secondary" onclick="workerRegister()">Create Worker Account</button></div><div class="card"><h2>🏢 Business</h2><p>Submit repetitive digital work.</p><button onclick="businessLogin()">Business Login</button><button class="secondary" onclick="businessRegister()">Create Business Account</button></div><div class="card"><h2>🛡️ Admin</h2><p>Manage platform and approve work.</p><button onclick="adminLogin()">Admin Login</button></div></div>'}function formCard(title,fields,submitText,fn){document.getElementById("app").innerHTML='<div class="card"><h2>'+title+'</h2>'+fields+'<button onclick="'+fn+'()">'+submitText+'</button><button class="secondary" onclick="home()">Back</button></div>'}function workerLogin(){formCard("Worker Login",'<input id="email" class="input" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password">',"Login","doWorkerLogin")}function workerRegister(){formCard("Worker Registration",'<input id="name" class="input" placeholder="Full Name"><input id="email" class="input" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password">',"Register","doWorkerRegister")}async function doWorkerLogin(){try{const d=await apiJson("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});worker=d.user;save();workerDashboard()}catch(e){alert(e.message)}}async function doWorkerRegister(){try{const d=await apiJson("/api/register",{method:"POST",body:JSON.stringify({name:name.value,email:email.value,password:password.value})});worker=d.user;save();workerDashboard()}catch(e){alert(e.message)}}function businessLogin(){formCard("Business Login",'<input id="email" class="input" placeholder="Business Email"><input id="password" class="input" type="password" placeholder="Password">',"Login","doBusinessLogin")}function businessRegister(){formCard("Business Registration",'<input id="name" class="input" placeholder="Your Name"><input id="company" class="input" placeholder="Company Name"><input id="email" class="input" placeholder="Business Email"><input id="phone" class="input" placeholder="Phone"><input id="password" class="input" type="password" placeholder="Password">',"Register","doBusinessRegister")}async function doBusinessLogin(){try{const d=await apiJson("/api/business/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});business=d.business;save();businessDashboard()}catch(e){alert(e.message)}}async function doBusinessRegister(){try{const d=await apiJson("/api/business/register",{method:"POST",body:JSON.stringify({name:name.value,company:company.value,email:email.value,phone:phone.value,password:password.value})});business=d.business;save();businessDashboard()}catch(e){alert(e.message)}}function adminLogin(){formCard("Admin Login",'<input id="email" class="input" placeholder="Admin Email"><input id="password" class="input" type="password" placeholder="Password">',"Login","doAdminLogin")}async function doAdminLogin(){try{const d=await apiJson("/api/admin/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});admin=d.admin;save();adminDashboard()}catch(e){alert(e.message)}}async function workerDashboard(){try{const[u,t,s]=await Promise.all([apiJson("/api/user/"+worker.id),apiJson("/api/tasks"),apiJson("/api/user/"+worker.id+"/submissions")]);worker=u;save();let taskHtml=t.length?t.map(task=>'<div class="task-card"><h3>'+escapeHtml(task.title)+'</h3><p>'+escapeHtml(task.description)+'</p>'+(task.imageUrl?'<img class="task-img" src="'+escapeAttr(task.imageUrl)+'">':"")+'<p><b>Reward: ₹'+task.reward+'</b> '+(task.remaining!==null?'<span class="badge">Remaining: '+task.remaining+'</span>':"")+'</p>'+(task.type==="text"?'<textarea id="ans_'+task.id+'" class="input" placeholder="Enter your answer"></textarea><button onclick="submitTask('+task.id+',document.getElementById(\'ans_'+task.id+'\').value)">Submit Answer</button>':'<button class="success" onclick="submitTask('+task.id+',\'YES\')">YES</button><button class="danger" onclick="submitTask('+task.id+',\'NO\')">NO</button>')+'</div>').join(""):'<p class="muted">No tasks available right now.</p>';let hist=s.length?s.slice().reverse().map(x=>'<div class="answer-box"><b>'+escapeHtml(x.title)+'</b><br>Answer: '+escapeHtml(x.answer)+'<br>Reward: ₹'+x.reward+'<br><span class="muted">'+new Date(x.createdAt).toLocaleString()+'</span></div>').join(""):'<p class="muted">No completed tasks yet.</p>';document.getElementById("app").innerHTML='<div class="topbar"><div><h2>Worker Dashboard</h2><span class="muted">Welcome, '+escapeHtml(worker.name)+'</span></div><button class="danger smallbtn" onclick="logout(\'worker\')">Logout</button></div><div class="grid"><div class="card"><div class="muted">Balance</div><div class="stat">₹'+worker.balance+'</div></div><div class="card"><div class="muted">Completed Tasks</div><div class="stat">'+worker.completedTasks+'</div></div><div class="card"><div class="muted">Available Tasks</div><div class="stat">'+t.length+'</div></div></div><div class="card"><h2>Available Work</h2>'+taskHtml+'</div><div class="card"><h2>Task History</h2>'+hist+'</div>'}catch(e){alert(e.message)}}async function submitTask(id,answer){try{const d=await apiJson("/api/tasks/submit",{method:"POST",body:JSON.stringify({userId:worker.id,taskId:id,answer})});alert("Task submitted! You earned ₹"+d.reward);worker.balance=d.balance;worker.completedTasks++;save();workerDashboard()}catch(e){alert(e.message)}}async function businessDashboard(){try{const list=await apiJson("/api/business/"+business.id+"/tasks");let html=list.length?list.slice().reverse().map(r=>{let qs=r.qualityStatus||"pending",badge=qs==="verified"?"<span class=\"badge green\">VERIFIED</span>":qs==="disputed"?"<span class=\"badge red\">DISPUTED</span>":"<span class=\"badge orange\">PENDING</span>",counts=Object.entries(r.answerCounts||{}).map(([a,c])=>'<span class="badge">'+escapeHtml(a)+": "+c+"</span>").join(" ");return'<div class="task-card"><h3>'+escapeHtml(r.title)+'</h3><p>'+escapeHtml(r.description)+'</p><p><span class="badge">'+escapeHtml(r.status)+'</span> '+badge+'</p><p>Reward: ₹'+r.reward+' per worker</p><p>Responses: <b>'+r.completed+" / "+r.workers+'</b></p>'+(r.taskId?'<div class="answer-box"><b>Quality Control</b><br>Required responses: '+r.qualityRequired+'<br>Answer distribution: '+(counts||'<span class="muted">No answers yet</span>')+'<br>'+(r.verifiedAnswer?'Verified Answer: <b>'+escapeHtml(r.verifiedAnswer)+'</b>':qs==="disputed"?'No majority — review required.':'Waiting for enough responses.')+'</div><div class="actions"><button class="export" onclick="exportBusinessTask('+r.taskId+')">📥 Export Results</button></div>':"")+'</div>'}).join(""):'<p class="muted">No work submitted yet.</p>';document.getElementById("app").innerHTML='<div class="topbar"><div><h2>Business Dashboard</h2><span class="muted">'+escapeHtml(business.company)+'</span></div><button class="danger smallbtn" onclick="logout(\'business\')">Logout</button></div><div class="card"><h2>Submit New Work</h2><input id="title" class="input" placeholder="Work title"><textarea id="description" class="input" placeholder="Describe exactly what workers should do"></textarea><input id="imageUrl" class="input" placeholder="Image URL (optional)"><select id="type" class="input"><option value="yesno">YES / NO</option><option value="text">Text Answer</option></select><input id="reward" class="input" type="number" min="1" placeholder="Reward per task (₹)"><input id="workers" class="input" type="number" min="3" value="3" placeholder="Number of workers"><button class="success" onclick="submitBusinessWork()">Submit Work for Approval</button></div><div class="card"><div class="topbar"><h2>My Work & Quality Results</h2><button class="export smallbtn" onclick="exportBusinessAll()">📥 Export All</button></div>'+html+'</div>'}catch(e){alert(e.message)}}async function submitBusinessWork(){try{await apiJson("/api/business/work",{method:"POST",body:JSON.stringify({businessId:business.id,title:title.value,description:description.value,imageUrl:imageUrl.value,type:type.value,reward:Number(reward.value),workers:Number(workers.value)})});alert("Work submitted for admin approval.");businessDashboard()}catch(e){alert(e.message)}}async function adminDashboard(){try{const[s,r]=await Promise.all([apiJson("/api/admin/stats"),apiJson("/api/admin/business-requests")]);let requests=r.length?r.slice().reverse().map(x=>{let qs=x.qualityStatus||"pending",badge=qs==="verified"?"<span class=\"badge green\">VERIFIED</span>":qs==="disputed"?"<span class=\"badge red\">DISPUTED</span>":"<span class=\"badge orange\">PENDING</span>",counts=Object.entries(x.answerCounts||{}).map(([a,c])=>'<span class="badge">'+escapeHtml(a)+": "+c+"</span>").join(" ");return'<div class="task-card"><h3>'+escapeHtml(x.title)+'</h3><p><b>Business:</b> '+escapeHtml(x.businessName)+'</p><p>'+escapeHtml(x.description)+'</p><p>Reward: ₹'+x.reward+' | Workers: '+x.completed+" / "+x.workers+'</p><p>Status: <span class="badge">'+escapeHtml(x.status)+'</span> '+badge+'</p>'+(x.status==="pending"?'<button class="success" onclick="approveWork('+x.id+')">Approve & Publish</button><button class="danger" onclick="rejectWork('+x.id+')">Reject</button>':"")+(x.taskId?'<div class="answer-box"><b>Quality Control</b><br>Required: 3 responses<br>Answer distribution: '+(counts||'<span class="muted">No responses yet</span>')+'<br>'+(x.verifiedAnswer?'Verified Answer: <b>'+escapeHtml(x.verifiedAnswer)+'</b>':qs==="disputed"?'⚠️ Disputed — no clear majority.':'⏳ Waiting for enough responses.')+'</div><div class="actions"><button class="export" onclick="exportAdminTask('+x.taskId+')">📥 Export Results</button></div>':"")+'</div>'}).join(""):'<p class="muted">No business requests.</p>';document.getElementById("app").innerHTML='<div class="topbar"><div><h2>Admin Dashboard</h2><span class="muted">Platform Management</span></div><button class="danger smallbtn" onclick="logout(\'admin\')">Logout</button></div><div class="grid"><div class="card"><div class="muted">Workers</div><div class="stat">'+s.users+'</div></div><div class="card"><div class="muted">Businesses</div><div class="stat">'+s.businesses+'</div></div><div class="card"><div class="muted">Submissions</div><div class="stat">'+s.submissions+'</div></div><div class="card"><div class="muted">Pending Requests</div><div class="stat">'+s.pendingBusinessRequests+'</div></div><div class="card"><div class="muted">Verified Tasks</div><div class="stat">'+s.verifiedTasks+'</div></div><div class="card"><div class="muted">Disputed Tasks</div><div class="stat">'+s.disputedTasks+'</div></div></div><div class="card"><div class="topbar"><h2>Business Work Requests & Quality Control</h2><button class="export smallbtn" onclick="exportAdminAll()">📥 Export All</button></div>'+requests+'</div><div class="card"><h2>Create Platform Task</h2><input id="ptitle" class="input" placeholder="Task title"><textarea id="pdescription" class="input" placeholder="Task description"></textarea><input id="pimage" class="input" placeholder="Image URL (optional)"><select id="ptype" class="input"><option value="yesno">YES / NO</option><option value="text">Text Answer</option></select><input id="preward" class="input" type="number" min="1" placeholder="Reward"><button onclick="createPlatformTask()">Create Task</button></div><div class="card"><h2>Platform Tasks</h2><div id="platformTasks">Loading...</div></div>' ;loadPlatformTasks()}catch(e){alert(e.message)}}async function approveWork(id){try{await apiJson("/api/admin/business-requests/"+id+"/approve",{method:"POST"});alert("Work approved and published.");adminDashboard()}catch(e){alert(e.message)}}async function rejectWork(id){try{await apiJson("/api/admin/business-requests/"+id+"/reject",{method:"POST"});alert("Work rejected.");adminDashboard()}catch(e){alert(e.message)}}async function createPlatformTask(){try{await apiJson("/api/tasks",{method:"POST",body:JSON.stringify({title:ptitle.value,description:pdescription.value,imageUrl:pimage.value,type:ptype.value,reward:Number(preward.value)})});alert("Task created.");ptitle.value="";pdescription.value="";pimage.value="";preward.value="";loadPlatformTasks()}catch(e){alert(e.message)}}async function loadPlatformTasks(){try{const t=await apiJson("/api/tasks");document.getElementById("platformTasks").innerHTML=t.map(x=>'<div class="task-card"><b>'+escapeHtml(x.title)+'</b><br>Reward: ₹'+x.reward+'<br>Type: '+x.type+'<br><span class="badge green">ACTIVE</span><br><button class="warning smallbtn" onclick="toggleTask('+x.id+')">Disable</button></div>').join("")||'<p class="muted">No active tasks.</p>'}catch(e){}}async function toggleTask(id){try{await apiJson("/api/tasks/"+id+"/toggle",{method:"POST"});adminDashboard()}catch(e){alert(e.message)}}home();</script></body></html>
